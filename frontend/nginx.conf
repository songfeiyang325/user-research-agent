# web 容器：nginx 既托管 Vue 打包静态，又当网关把 /api 转发给 backend
# 本文件被放进 /etc/nginx/conf.d/default.conf（外层 http{} 由 nginx 默认配置提供）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由回退：/ 、/r/:path 等都交给前端 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 网关：/api/* 反向代理到后端容器（compose 服务名 backend）
    location /api/ {
        proxy_pass http://backend:8000;          # 不带尾斜杠 → 保留 /api 前缀
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ---- SSE 流式必需：关闭缓冲、拉长超时，否则对话不会逐字返回 ----
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
