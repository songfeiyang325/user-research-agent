[project]
name = "user-research-agent"
version = "0.1.0"
description = "用户调研 Agent —— 对话式设计 + 全流程调研智能体（基于智谱 GLM）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pymongo>=4.8",
    "openai>=1.40",
    "numpy>=1.26",
    "scipy>=1.11",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mongomock>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
